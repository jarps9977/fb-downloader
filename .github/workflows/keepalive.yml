name: Keep Render awake

on:
  schedule:
    # Render free instances sleep after 15 minutes idle; GitHub may delay scheduled runs.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 90 --retry 2 https://super-downloads.onrender.com/healthz
